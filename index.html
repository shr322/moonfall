<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101914"><meta name="description" content="달이 지기 전까지 살아남아라. 자동 전투와 무기 진화가 있는 무료 서바이벌 게임."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./assets/icon-192.png"><link rel="apple-touch-icon" href="./assets/icon-192.png"><link rel="stylesheet" href="./style.css"><title>MOONFALL · 달빛의 생존자</title></head>
<body>
<canvas id="world" aria-label="몬스터가 몰려오는 달빛 숲 전장"></canvas><div class="vignette"></div>
<main id="home" class="screen home">
 <header><a class="brand" href="./" aria-label="Moonfall 처음으로"><span class="sigil">☽</span> MOONFALL</a><div class="header-actions"><button class="quiet" id="install">↧ <span>앱 설치</span></button><button class="quiet sound" aria-label="소리 켜기">소리 OFF</button></div></header>
 <section class="intro"><div class="eyebrow"><i></i> THE NIGHT IS ALIVE</div><h1>달이 지면,<br><em>우리가 남는다.</em></h1><p>끝없이 밀려오는 어둠. 진화하는 마법.<br>당신에게 주어진 시간, 6분.</p><div class="playline"><button id="start" class="primary">숲으로 들어가기 <span>↗</span></button><span class="tag">자동 공격<br>당신은 이동만.</span></div><div class="controls-note"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 또는 방향키 <span>·</span> 모바일은 드래그</div></section>
 <div class="scene-caption"><span>01 / THE FORGOTTEN GROVE</span><strong>잊힌 자들의 숲</strong><small>달빛이 닿지 않는 곳에서, 사냥이 시작된다.</small></div>
 <section class="bottom-panel"><div class="section-head"><span>생존자를 선택하세요</span><button id="growth" class="text-button">영구 강화 <b id="coins">0</b> ◈</button></div><div id="heroes" class="heroes"></div><footer><span><i></i> 한 번 더, 더 강하게.</span><button id="guide">플레이 가이드 ↗</button><span class="desktop-only">SURVIVE. EVOLVE. REPEAT.</span></footer></section>
</main>
<div id="hud" hidden><div class="xp-track"><div id="xp"></div></div><div class="hud-top"><div class="vitals"><span id="heroName"></span><div class="health-track"><div id="health"></div><small id="healthText"></small></div><span id="level"></span></div><div class="clock"><strong id="timer">00:00</strong><span> / 06:00</span><small id="wave">숲이 깨어납니다</small></div><div class="hud-actions"><span id="kills">0 처치</span><button id="pause" aria-label="일시정지">Ⅱ</button></div></div><div id="boss" hidden><span id="bossName"></span><div><i id="bossHealth"></i></div></div><div class="hud-bottom"><div id="weapons"></div><span id="runCoins">◈ 0</span></div><div id="joy"><i></i></div><div id="touchHint">화면을 드래그해서 이동하세요</div></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modalContent"></div></section></div>
<script src="./engine.js"></script><script src="./game.js"></script>
</body></html>
